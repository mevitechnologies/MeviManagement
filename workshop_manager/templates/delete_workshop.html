{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card border-0 shadow">

                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0">
                        Delete Workshop
                    </h5>
                </div>

                <div class="card-body p-4">

                    <div class="alert alert-warning">

                        <strong>Warning</strong>

                        <p class="mb-0 mt-2">
                            You are about to permanently delete:
                        </p>

                    </div>

                    <h4>
                        {{ workshop.title }}
                    </h4>

                    <p class="text-muted">
                        {{ workshop.college }}
                    </p>

                    <p>
                        {{ workshop.start_date }}
                        -
                        {{ workshop.end_date }}
                    </p>

                    <p class="text-danger">
                        This action cannot be undone.
                    </p>

                    <form method="post">

                        {% csrf_token %}

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-danger">
                                Yes, Delete Workshop
                            </button>

                            <a
                                href="{% url 'workshop_detail' workshop.id %}"
                                class="btn btn-secondary">
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
