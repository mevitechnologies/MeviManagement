{% extends "base.html" %}

{% block content %}

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-success text-white">

                    <h4 class="mb-0">
                        📚 Daily Learning
                    </h4>

                </div>

                <div class="card-body">

                    <div class="mb-4">

                        <h5>
                            {{ trainer.Name }}
                        </h5>

                        <p class="text-muted mb-0">
                            {{ today|date:"l, d F Y" }}
                        </p>

                    </div>

                    <form method="post">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                What did you learn today?
                            </label>

                            {{ form.learning }}

                        </div>

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-success">

                                💾 Save Learning

                            </button>

                            <a
                                href="{% url 'trainer_dashboard' %}"
                                class="btn btn-outline-secondary">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
